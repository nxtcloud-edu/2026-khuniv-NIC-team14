<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스레슨 — 핵심 포인트 학습</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">NL</div>
      <div class="brand-name">뉴스레슨</div>
    </div>

    <nav class="nav">
      <a class="nav-link" href="index.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" /></svg></span>
        홈
      </a>
      <a class="nav-link active" href="lesson.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-6-1.7v13c2.4 0 4.5.5 6 1.7 1.5-1.2 3.6-1.7 6-1.7v-13c-2.4 0-4.5.5-6 1.7Z" /><path d="M12 6.5v13" /></svg></span>
        학습
      </a>
      <a class="nav-link" href="summary.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10a2.4 2.4 0 0 0-4-4L4 16v4Z" /><path d="M13 7l4 4" /></svg></span>
        정리하기
      </a>
      <a class="nav-link" href="mypage.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.2" /><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" /></svg></span>
        마이페이지
      </a>
    </nav>

    <div class="sidebar-footer">
      요약이 아니라 선별.<br />압축이 아니라 압축 해제.
    </div>
  </aside>

  <main class="main">
    <div class="page-container">

      <header class="page-header">
        <span class="page-eyebrow">AI 핵심 포인트 분석</span>
        <h1 class="page-title">핵심 포인트를 하나씩 학습해보세요</h1>
        <p class="page-subtitle">쉬운 설명부터 기사 속 맥락, 경제적 영향까지 순서대로 확인해요.</p>
      </header>

      <div class="progress-header" id="progress-header" style="display: none;">
        <span class="section-title" style="margin: 0;">핵심 포인트</span>
        <span class="progress-count" id="progress-count">1 / 1</span>
      </div>
      <div class="progress-track" id="progress-track" style="display: none;">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>

      <section class="card state-card" id="loading-state" style="display: flex;">
        <div class="loading-spinner"></div>
        <p class="state-text">핵심 포인트를 분석하고 있어요...</p>
      </section>

      <section class="card state-card" id="error-state" style="display: none;">
        <p class="state-text" id="error-message">핵심 포인트를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>
        <button type="button" id="retry-btn" class="btn btn-secondary" style="margin-top: 16px;">다시 시도</button>
      </section>

      <section class="card" id="lesson-card" style="display: none;">
        <h2 class="point-topic" id="point-topic"></h2>

        <div class="definition-row">
          <span class="definition-label">개념 정의</span>
          <p class="definition-text" id="step-definition"></p>
        </div>

        <div class="step">
          <span class="step-badge">1</span>
          <div class="step-body">
            <p class="step-label">쉽게 말하면</p>
            <p class="step-text" id="step-easy"></p>
          </div>
        </div>

        <div class="step">
          <span class="step-badge">2</span>
          <div class="step-body">
            <p class="step-label">이 기사에서는</p>
            <p class="step-text" id="step-context"></p>
          </div>
        </div>

        <div class="step">
          <span class="step-badge">3</span>
          <div class="step-body">
            <p class="step-label">그래서 어떤 영향?</p>
            <ul class="step-text impact-list" id="step-impact-list"></ul>
          </div>
        </div>
      </section>

      <div class="btn-row">
        <button type="button" id="prev-btn" class="btn btn-secondary">이전으로</button>
        <button type="button" id="next-btn" class="btn btn-primary">다음 포인트</button>
      </div>

    </div>
  </main>

</div>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="lesson.js"></script>
</body>
</html>
