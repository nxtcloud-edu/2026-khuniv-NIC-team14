<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스레슨 — 마이페이지</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo-sidebar.png" alt="뉴스레슨 로고" class="brand-mark" />
      <div class="brand-name">뉴스레슨</div>
    </div>

    <div class="sidebar-user" id="sidebar-user">
      <span class="sidebar-user-name" id="sidebar-user-name">게스트</span>님의 학습 기록
    </div>

    <nav class="nav">
      <a class="nav-link" href="index.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" /></svg></span>
        홈
      </a>
      <a class="nav-link" href="lesson.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-6-1.7v13c2.4 0 4.5.5 6 1.7 1.5-1.2 3.6-1.7 6-1.7v-13c-2.4 0-4.5.5-6 1.7Z" /><path d="M12 6.5v13" /></svg></span>
        학습
      </a>
      <a class="nav-link" href="summary.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10a2.4 2.4 0 0 0-4-4L4 16v4Z" /><path d="M13 7l4 4" /></svg></span>
        정리하기
      </a>
      <a class="nav-link" href="chatbot.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4.5 4V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z" /></svg></span>
        챗봇
      </a>
      <a class="nav-link active" href="mypage.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.2" /><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" /></svg></span>
        마이페이지
      </a>
    </nav>

    <div class="sidebar-footer">
      요약이 아니라 선별.<br />압축이 아니라 압축 해제.
    </div>
  </aside>

  <main class="main">
    <div class="page-container">

      <header class="page-header">
        <span class="page-eyebrow">마이페이지</span>
        <h1 class="page-title" id="mypage-title">지금까지의 학습 기록이에요</h1>
        <p class="page-subtitle">꾸준히 정리할수록 경제 뉴스가 익숙해져요.</p>
      </header>

      <div class="stat-grid">
        <div class="stat-card stat-card--blue">
          <div class="stat-value" id="stat-summaries">0<span class="stat-unit">건</span></div>
          <p class="stat-label">직접 정리한 뉴스 수</p>
        </div>
        <div class="stat-card stat-card--green">
          <div class="stat-value" id="stat-points">0<span class="stat-unit">개</span></div>
          <p class="stat-label">이해한 핵심 포인트 수</p>
        </div>
        <div class="stat-card stat-card--orange">
          <div class="stat-value" id="stat-weekly">0 / 3</div>
          <p class="stat-label">이번 주 학습 수</p>
          <div class="stat-progress-track">
            <div class="stat-progress-fill" id="stat-weekly-progress-fill"></div>
          </div>
          <p class="stat-progress-message" id="stat-weekly-message"></p>
        </div>
        <div class="stat-card stat-card--purple">
          <div class="stat-value" id="stat-streak">0<span class="stat-unit">일</span></div>
          <p class="stat-label">연속 학습일</p>
        </div>
      </div>

      <section>
        <div class="section-title">
          <span>최근 학습한 뉴스</span>
          <button type="button" id="reset-history-btn" class="btn btn-ghost">학습 기록 초기화</button>
        </div>
        <div class="list" id="mypage-recent-list"></div>
      </section>

    </div>
  </main>

</div>
<script src="storage.js"></script>
<script src="mypage.js"></script>
</body>
</html>
