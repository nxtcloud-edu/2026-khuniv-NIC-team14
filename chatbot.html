        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-6-1.7v13c2.4 0 4.5.5 6 1.7 1.5-1.2 3.6-1.7 6-1.7v-13c-2.4 0-4.5.5-6 1.7Z" /><path d="M12 6.5v13" /></svg></span>

      요약이 아니라 선별.<br />압축이 아니라 압축 해제.

  <main class="main">
    <div class="page-container">

      <header class="page-header">
        <span class="page-eyebrow">경제 상식 챗봇</span>
        <h1 class="page-title">궁금한 경제 상식을 자유롭게 물어보세요</h1>
        <p class="page-subtitle">특정 기사와 상관없이, 경제 개념이나 원리에 대해 무엇이든 질문할 수 있어요.</p>
      </header>

      <section class="card chatbot-panel">
        <div class="chatbot-messages" id="chatbot-messages"></div>

        <form class="chatbot-input-row" id="chatbot-form">
          <input
            type="text"
            class="text-input chatbot-input"
            id="chatbot-input"
            placeholder="예: 금리가 오르면 왜 물가가 잡히나요?"
            maxlength="500"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-primary chatbot-send-btn" id="chatbot-send-btn">전송</button>
        </form>
      </section>

      <p class="card-disclaimer">※ 대화 내용은 이 탭에서만 유지되며, 새로고침하거나 탭을 닫으면 초기화됩니다.</p>
