<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스레슨 — 내 말로 정리하기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">NL</div>
      <div class="brand-name">뉴스레슨</div>
    </div>

    <nav class="nav">
      <a class="nav-link" href="index.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" /></svg></span>
        홈
      </a>
      <a class="nav-link" href="lesson.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-6-1.7v13c2.4 0 4.5.5 6 1.7 1.5-1.2 3.6-1.7 6-1.7v-13c-2.4 0-4.5.5-6 1.7Z" /><path d="M12 6.5v13" /></svg></span>
        학습
      </a>
      <a class="nav-link active" href="summary.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10a2.4 2.4 0 0 0-4-4L4 16v4Z" /><path d="M13 7l4 4" /></svg></span>
        정리하기
      </a>
      <a class="nav-link" href="mypage.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.2" /><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" /></svg></span>
        마이페이지
      </a>
    </nav>

    <div class="sidebar-footer">
      요약이 아니라 선별.<br />압축이 아니라 압축 해제.
    </div>
  </aside>

  <main class="main">
    <div class="page-container">

      <header class="page-header">
        <span class="page-eyebrow">한국은행, 기준금리 3.25%로 동결</span>
        <h1 class="page-title">이제 내 말로 정리해보세요</h1>
        <p class="page-subtitle">배운 내용을 직접 정리하면 훨씬 오래 기억에 남아요. (인출 학습)</p>
      </header>

      <section class="card">
        <h2 class="section-title">기사 정리하기</h2>
        <textarea
          class="textarea"
          placeholder="이 기사에서 배운 핵심 포인트와 그 의미를 자신의 언어로 정리해보세요."
        ></textarea>
        <div class="field-meta">
          <span>0자 작성됨</span>
          <span>짧아도 괜찮아요, 내 생각으로 적어보세요</span>
        </div>

        <div style="margin-top: 22px;">
          <p class="step-label" style="margin-bottom: 10px;">이런 내용이 들어가면 좋아요</p>
          <div class="chip-row">
            <span class="chip"><span class="chip-dot"></span>기준금리</span>
            <span class="chip"><span class="chip-dot"></span>가계부채</span>
            <span class="chip"><span class="chip-dot"></span>환율 방어</span>
            <span class="chip"><span class="chip-dot"></span>물가 안정</span>
            <span class="chip"><span class="chip-dot"></span>외국인 자금</span>
          </div>
        </div>

        <div class="hint-box">
          정리를 마치면 원문 기사, 학습 포인트와 함께 마이페이지에 저장돼요. 이후 원하면 이해도를 확인하는 퀴즈도 풀 수 있어요.
        </div>
      </section>

      <div class="btn-row">
        <a href="lesson.html" class="btn btn-secondary">이전으로</a>
        <a href="complete.html" class="btn btn-primary">학습 완료</a>
      </div>

    </div>
  </main>

</div>
</body>
</html>
