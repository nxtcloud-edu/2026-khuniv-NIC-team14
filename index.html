<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스레슨 — 경제 뉴스 학습</title>
<script src="storage.js"></script>
<script>
  // 닉네임 없이 직접 접근하면 온보딩(splash)으로 되돌린다.
  if (!getNickname()) {
    window.location.replace("splash.html");
  }
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo-sidebar.png" alt="뉴스레슨 로고" class="brand-mark" />
      <div class="brand-name">뉴스레슨</div>
    </div>

    <nav class="nav">
      <a class="nav-link active" href="index.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" /></svg></span>
        홈
      </a>
      <a class="nav-link" href="lesson.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-6-1.7v13c2.4 0 4.5.5 6 1.7 1.5-1.2 3.6-1.7 6-1.7v-13c-2.4 0-4.5.5-6 1.7Z" /><path d="M12 6.5v13" /></svg></span>
        학습
      </a>
      <a class="nav-link" href="summary.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10a2.4 2.4 0 0 0-4-4L4 16v4Z" /><path d="M13 7l4 4" /></svg></span>
        정리하기
      </a>
      <a class="nav-link" href="chatbot.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4.5 4V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z" /></svg></span>
        챗봇
      </a>
      <a class="nav-link" href="mypage.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.2" /><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" /></svg></span>
        마이페이지
      </a>
    </nav>

    <div class="sidebar-footer">
      요약이 아니라 선별.<br />압축이 아니라 압축 해제.
    </div>
  </aside>

  <main class="main">
    <div class="page-container">

      <header class="page-header">
        <span class="page-eyebrow">경제 뉴스 학습</span>
        <h1 class="page-title">경제 뉴스, 붙여넣고 제대로 이해해보세요</h1>
        <p class="page-subtitle">AI가 기사에서 꼭 알아야 할 핵심 포인트만 골라 단계적으로 설명해드려요.</p>
      </header>

      <section class="card">
        <h2 class="section-title">기사 본문 붙여넣기</h2>

        <div class="url-input-row">
          <input
            type="url"
            class="text-input"
            id="article-url-input"
            placeholder="기사 URL을 붙여넣으면 본문을 자동으로 가져와요 (선택)"
            autocomplete="off"
          />
          <button type="button" id="fetch-url-btn" class="btn btn-secondary">가져오기</button>
        </div>
        <p class="field-error" id="url-fetch-message"></p>

        <textarea
          class="textarea"
          placeholder="여기에 경제 뉴스 기사 본문을 붙여넣어 주세요. (최대 10,000자)"
          maxlength="10000"
          style="margin-top: 14px;"
        ></textarea>
        <div class="field-meta">
          <span id="char-counter">0 / 10,000자</span>
          <span>핵심 포인트 1~3개를 AI가 자동으로 선정해요</span>
        </div>
        <button type="button" id="start-lesson-btn" class="btn btn-primary btn-block" style="margin-top: 20px;">
          학습 시작하기
        </button>
      </section>

      <section style="margin-top: 40px;">
        <h2 class="section-title">최근 학습</h2>
        <div class="list" id="recent-list"></div>
      </section>

    </div>
  </main>

</div>
<script src="script.js"></script>
<script src="index.js"></script>
</body>
</html>
