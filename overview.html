<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스레슨 — 기사 다시 이해하기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo-sidebar.png" alt="뉴스레슨 로고" class="brand-mark" />
      <div class="brand-name">뉴스레슨</div>
    </div>

    <nav class="nav">
      <a class="nav-link" href="index.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" /></svg></span>
        홈
      </a>
      <a class="nav-link active" href="lesson.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-6-1.7v13c2.4 0 4.5.5 6 1.7 1.5-1.2 3.6-1.7 6-1.7v-13c-2.4 0-4.5.5-6 1.7Z" /><path d="M12 6.5v13" /></svg></span>
        학습
      </a>
      <a class="nav-link" href="summary.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10a2.4 2.4 0 0 0-4-4L4 16v4Z" /><path d="M13 7l4 4" /></svg></span>
        정리하기
      </a>
      <a class="nav-link" href="chatbot.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4.5 4V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z" /></svg></span>
        챗봇
      </a>
      <a class="nav-link" href="mypage.html">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.2" /><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" /></svg></span>
        마이페이지
      </a>
    </nav>

    <div class="sidebar-footer">
      요약이 아니라 선별.<br />압축이 아니라 압축 해제.
    </div>
  </aside>

  <main class="main">
    <div class="page-container">

      <header class="page-header">
        <span class="page-eyebrow">기사 다시 이해하기</span>
        <span class="review-badge" id="review-badge">🔁 다시보기</span>
        <h1 class="page-title">이제 기사를 다시 살펴볼까요?</h1>
        <p class="page-subtitle">방금 배운 핵심 개념을 바탕으로, 기사에서 실제로 일어난 일을 정리해드려요.</p>
      </header>

      <section class="card state-card" id="loading-state" style="display: flex;">
        <div class="loading-spinner"></div>
        <p class="state-text">기사 흐름을 다시 정리하고 있어요...</p>
      </section>

      <section class="card state-card" id="error-state" style="display: none;">
        <p class="state-text" id="error-message">기사 요약을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>
        <button type="button" id="retry-btn" class="btn btn-secondary" style="margin-top: 16px;">다시 시도</button>
      </section>

      <section class="card" id="overview-card" style="display: none;">
        <div class="overview-text" id="overview-text"></div>
      </section>

      <p class="card-disclaimer" id="overview-disclaimer" style="display: none;">
        ※ 본 요약에는 글을 작성한 기자의 해석 또는 의견이 포함될 수 있습니다.
      </p>

      <div class="btn-row" id="overview-actions" style="display: none;">
        <button type="button" id="next-btn" class="btn btn-primary btn-block">퀴즈 풀러 가기</button>
      </div>

    </div>
  </main>

</div>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="storage.js"></script>
<script src="overview.js"></script>
</body>
</html>
