<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뉴스레슨 — 학습 완료</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="celebrate-page">
  <div class="celebrate-glow glow-1"></div>
  <div class="celebrate-glow glow-2"></div>

  <a class="celebrate-brand" href="index.html">
    <img src="assets/logo-sidebar.png" alt="뉴스레슨 로고" class="brand-mark" />
    <div class="brand-name">뉴스레슨</div>
  </a>

  <div class="celebrate-card">
    <div class="check-badge">
      <svg viewBox="0 0 100 100" width="88" height="88">
        <circle class="check-circle-bg" cx="50" cy="50" r="45" />
        <circle class="check-circle" cx="50" cy="50" r="45" />
        <path class="check-mark" d="M30 52 L44 66 L72 34" />
      </svg>
    </div>

    <span class="review-badge" id="review-badge">🔁 다시보기</span>
    <p class="celebrate-eyebrow" id="celebrate-eyebrow">오늘의 학습</p>
    <h1 class="celebrate-title">오늘의 뉴스 학습 완료!</h1>
    <p class="celebrate-subtitle" id="celebrate-subtitle">핵심 포인트 학습부터 내 언어로 정리하기까지 모두 마쳤어요.</p>

    <div class="streak-badge" id="streak-badge" style="display: none;"></div>

    <div class="celebrate-actions">
      <button type="button" class="btn btn-primary btn-block">공유하기</button>
      <a href="mypage.html" class="btn btn-secondary btn-block">마이페이지로</a>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script src="storage.js"></script>
<script src="complete.js"></script>
</body>
</html>
